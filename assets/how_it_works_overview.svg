<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Twilight works: slots pick the scene, an activity switches the lights</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="470" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="185" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0969da">Which scene?</text>
  <text x="500" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#9a6700">Are the lights on?</text>
  <rect x="40" y="48" width="290" height="64" rx="11" fill="#ffffff" stroke="#8c959f"/>
  <text x="185" y="77.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Sun &amp; clock</text>
  <text x="185" y="95.5" text-anchor="middle" font-size="12.5" fill="#57606a">sun events and fixed times</text>
  <rect x="360" y="48" width="280" height="64" rx="11" fill="#ffffff" stroke="#8c959f"/>
  <text x="500" y="77.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Sensors, switches, timers</text>
  <text x="500" y="95.5" text-anchor="middle" font-size="12.5" fill="#57606a">through Inputs</text>
  <line x1="185" y1="112" x2="185" y2="148" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="112" x2="500" y2="148" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="135" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a">request or release</text>
  <rect x="40" y="152" width="290" height="76" rx="11" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="185" y="187.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Channels &amp; Slots</text>
  <text x="185" y="205.5" text-anchor="middle" font-size="12.5" fill="#57606a">every channel always has a current slot</text>
  <rect x="380" y="152" width="240" height="76" rx="11" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
  <text x="500" y="187.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Activity</text>
  <text x="500" y="205.5" text-anchor="middle" font-size="12.5" fill="#57606a">only one at a time</text>
  <rect x="650" y="152" width="120" height="76" rx="11" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="710" y="178.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Rules</text>
  <text x="710" y="196.5" text-anchor="middle" font-size="12.5" fill="#57606a">change the</text>
  <text x="710" y="213.5" text-anchor="middle" font-size="12.5" fill="#57606a">running activity</text>
  <line x1="650" y1="190" x2="624" y2="190" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="185" y1="228" x2="185" y2="272" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="228" x2="500" y2="272" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="193" y="255" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a">current scene</text>
  <text x="508" y="255" text-anchor="start" font-size="12.5" font-weight="600" fill="#57606a">starts it, ends it</text>
  <rect x="40" y="276" width="600" height="64" rx="11" fill="#ffffff" stroke="#8c959f"/>
  <text x="340" y="305.5" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Action</text>
  <text x="340" y="323.5" text-anchor="middle" font-size="12.5" fill="#57606a">Slot · Scene / Script · Block Only · Presence Simulation · Reset</text>
  <line x1="340" y1="340" x2="340" y2="376" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="380" width="600" height="66" rx="11" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="340" y="411" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Lights</text>
  <text x="340" y="429" text-anchor="middle" font-size="12.5" fill="#57606a">Without an activity, Twilight switches nothing on.</text>
</svg>
