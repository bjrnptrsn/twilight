trigger_input:
  name: Trigger Input
  description: Triggers a button-type input manually (click or toggle) for a given area.
  fields:
    area_id:
      name: Area ID
      description: The area ID containing the input.
      required: true
      selector:
        text:
    input_id:
      name: Input ID
      description: The ID or name of the button input to trigger.
      required: true
      selector:
        text:
    active:
      name: Active State
      description: For toggle buttons, sets whether the input state should be active (true) or inactive (false).
      required: false
      selector:
        boolean:
